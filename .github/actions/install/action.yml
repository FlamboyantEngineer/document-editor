name: Install
description: Node from .nvmrc and node_modules exactly as the lock gives them, kept between runs.
inputs:
  read-token:
    description: The token that reads the base component library, a private git dependency.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    # The installed tree is kept per system, Node version and lock file, and only an exact match is
    # used: anything else installs from nothing with `npm ci`, so a kept tree only saves time. It is
    # saved right after the install, before any job step writes into node_modules.
    - id: modules
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json', '.nvmrc') }}
    # npm fetches GitHub dependencies over SSH first, so every GitHub URL form is rewritten to HTTPS
    # with the read token, for the install alone: the rewrite lives in this step's environment and is
    # never written to disk.
    - name: Install, reading the base component library with the read token
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      env:
        GIT_CONFIG_COUNT: 3
        GIT_CONFIG_KEY_0: url.https://x-access-token:${{ inputs.read-token }}@github.com/FlamboyantEngineer/.insteadOf
        GIT_CONFIG_VALUE_0: https://github.com/FlamboyantEngineer/
        GIT_CONFIG_KEY_1: url.https://x-access-token:${{ inputs.read-token }}@github.com/FlamboyantEngineer/.insteadOf
        GIT_CONFIG_VALUE_1: ssh://git@github.com/FlamboyantEngineer/
        GIT_CONFIG_KEY_2: url.https://x-access-token:${{ inputs.read-token }}@github.com/FlamboyantEngineer/.insteadOf
        GIT_CONFIG_VALUE_2: git@github.com:FlamboyantEngineer/
      run: npm ci
    - if: steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}
