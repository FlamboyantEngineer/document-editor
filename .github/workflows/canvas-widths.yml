# Temporary (thread P spike): the cross-system Canvas width check on Linux, Windows and macOS.
# Removed before the spike's pull request merges.
name: Canvas widths

on:
  push:
    branches: [claude/project-thread-a7myl2]
    paths:
      - .github/workflows/canvas-widths.yml
      - labs/src/spikes/forced-lines/canvas-widths.mjs

permissions:
  contents: read

jobs:
  widths:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the probe's tools and fonts
        shell: bash
        run: |
          mkdir -p probe fonts
          cd probe
          npm init -y > /dev/null
          npm i --no-audit --no-fund playwright@1.64.1 katex@0.19.1 geist@1.9.2
          npx playwright install chromium
          cp "node_modules/geist/dist/fonts/geist-sans/Geist[wght].woff2" ../fonts/geist-latin-wght-normal.woff2
          cp node_modules/katex/dist/fonts/KaTeX_Main-Regular.woff2 node_modules/katex/dist/fonts/KaTeX_SansSerif-Regular.woff2 ../fonts/
          cp ../labs/src/spikes/forced-lines/canvas-widths.mjs .
      - name: Measure
        shell: bash
        working-directory: probe
        run: |
          node canvas-widths.mjs ../fonts "widths-${{ matrix.os }}.json"
          node -e "const r=require('./widths-${{ matrix.os }}.json');console.log('JSON '+JSON.stringify({os:r.os,chromium:r.chromium,runs:r.runs.map(x=>({dpr:x.dpr,canvas:x.canvas.auto,geometric:x.canvas.geometricPrecision,worker:x.canvas.worker}))}))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: widths-${{ matrix.os }}
          path: probe/widths-${{ matrix.os }}.json
