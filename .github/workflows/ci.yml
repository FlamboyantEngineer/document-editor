name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The base component library is a private git dependency. npm fetches GitHub dependencies over
      # SSH first, so every GitHub URL form is rewritten to HTTPS with the read token.
      - name: Let git read the base component library
        env:
          TOKEN: ${{ secrets.UI_COMPONENTS_READ_TOKEN }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/FlamboyantEngineer/"
          git config --global --add url."$base".insteadOf "https://github.com/FlamboyantEngineer/"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/FlamboyantEngineer/"
          git config --global --add url."$base".insteadOf "git@github.com:FlamboyantEngineer/"
      - run: npm ci
      # The browser tests need Playwright's own Chromium, which the runner image does not carry.
      - run: npx playwright install --with-deps chromium
      - name: Checks
        run: npm run check
