name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The base component library is a private git dependency. npm fetches GitHub dependencies over
      # SSH first, so every GitHub URL form is rewritten to HTTPS with the read token, for the
      # install alone: the rewrite lives in this step's environment and is never written to disk.
      - name: Install, reading the base component library with the read token
        env:
          GIT_CONFIG_COUNT: 3
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/FlamboyantEngineer/
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_1: ssh://git@github.com/FlamboyantEngineer/
          GIT_CONFIG_KEY_2: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_2: git@github.com:FlamboyantEngineer/
        run: npm ci
      # scripts/check.mjs is the one list of gates, shared with `npm run check` locally. The browser
      # tests run in the labs jobs beside it.
      - name: Checks
        run: npm run check -- --skip test:labs --skip check:consumer --skip test:guard-budgets
      # The packed-consumer check installs the pinned repositories again, with the read token.
      - name: Packed consumer with the tested set
        env:
          GIT_CONFIG_COUNT: 3
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/FlamboyantEngineer/
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_1: ssh://git@github.com/FlamboyantEngineer/
          GIT_CONFIG_KEY_2: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_2: git@github.com:FlamboyantEngineer/
        run: npm run check:consumer

  labs:
    # The browser tests of `npm run test:labs`, split across runners: the Chromium lab tests in
    # shards, and the timing tests in a job of their own, so no other test shares their machine.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The one-result invariant's page checks at ratio 1, the heaviest tests, follow each shard,
          # a third each; the display scaling ratios follow the last.
          - name: chromium 1 of 3
            args: --project=chromium --shard=1/3
            then: --project=chromium-invariant --shard=1/3
          - name: chromium 2 of 3
            args: --project=chromium --shard=2/3
            then: --project=chromium-invariant --shard=2/3
          - name: chromium 3 of 3
            args: --project=chromium --shard=3/3
            then: --project=chromium-invariant --shard=3/3
            after: --project=chromium-dpr-1.5 --project=chromium-dpr-1.75 --project=chromium-dpr-3
          # The Pretext closeness tests and the one-result invariant at real device pixel ratios, but
          # for the pages painted into canvases (DOCE-EDITOR-1.9, DOCE-LABS-8.9), which the
          # performance job runs after its timing tests.
          - name: device pixel ratios
            # Quoted: the arguments are written into the step's script, where a bare `|` is a pipe.
            args: "--project=chromium-dpr-1.25 --project=chromium-dpr-2 --grep-invert='DOCE-EDITOR-1.9|DOCE-LABS-8.9'"
          # Without their dependency on the lab tests, which the shards run; the heaviest timing test
          # still runs alone before the others.
          - name: performance
            args: --project=review-scale --no-deps
            then: --project=performance --no-deps
            after: --project=chromium-dpr-1.25 --project=chromium-dpr-2 --grep=DOCE-EDITOR-1.9|DOCE-LABS-8.9
    name: labs (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The base component library is a private git dependency, read with the token as in the gates job.
      - name: Install, reading the base component library with the read token
        env:
          GIT_CONFIG_COUNT: 3
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/FlamboyantEngineer/
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_1: ssh://git@github.com/FlamboyantEngineer/
          GIT_CONFIG_KEY_2: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_2: git@github.com:FlamboyantEngineer/
        run: npm ci
      # The browser tests need Playwright's own Chromium, which the runner image does not carry.
      - run: npx playwright install --with-deps chromium
      # The print tests read each printed sheet's text with pdftotext.
      - run: sudo apt-get install -y poppler-utils
      - run: npm run build:labs
      # Guard timing shares only the dedicated performance runner, sequentially with browser budgets.
      - name: Guard functional cases and budgets
        if: matrix.name == 'performance'
        run: npm run test:guard-budgets
      - name: Lab browser tests (${{ matrix.name }})
        run: |
          npx playwright test ${{ matrix.args }}
          if [ -n "$THEN" ]; then npx playwright test $THEN; fi
          if [ -n "$AFTER" ]; then npx playwright test $AFTER; fi
        env:
          THEN: ${{ matrix.then }}
          AFTER: ${{ matrix.after }}

  font-file-changes:
    # Whether the change reaches the font-file widths: the measurer and the layout engine, its test
    # helpers and fonts, the dependencies (the Pretext fork pin, HarfBuzz, the font packages) or this
    # workflow. A push to dev or main always counts.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo changed=true >> "$GITHUB_OUTPUT"; exit 0; fi
          paths='^(src/layout-engine/|test/font-files-|test/fixtures/fonts/|package\.json$|package-lock\.json$|vitest\.config\.ts$|\.github/workflows/ci\.yml$)'
          if git diff --name-only "$BASE" HEAD | grep -Eq "$paths"; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo changed=false >> "$GITHUB_OUTPUT"
          fi

  font-files:
    # The font-file widths and line breaks in Node on macOS and Windows (DOCE-PAGINATION-12.1), the
    # fingerprints the Linux jobs pin, with no browser: the same files shall give the same result on
    # every system.
    needs: font-file-changes
    if: needs.font-file-changes.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    name: font files (${{ matrix.os }})
    steps:
      # The fonts and fixtures are read as bytes: no line ending conversion on Windows.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # A cold `npm ci` takes about 16 minutes on Windows (the git dependencies are prepared there), so
      # the installed tree is kept per system and lock file. An older tree is brought up to the lock
      # with `npm install`, and only a miss installs from nothing.
      - id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: font-files-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', '.nvmrc') }}
          restore-keys: font-files-modules-${{ runner.os }}-
      # The base component library is a private git dependency, read with the token as in the gates job.
      - name: Install, reading the base component library with the read token
        if: steps.modules.outputs.cache-hit != 'true'
        env:
          GIT_CONFIG_COUNT: 3
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/FlamboyantEngineer/
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_1: ssh://git@github.com/FlamboyantEngineer/
          GIT_CONFIG_KEY_2: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_2: git@github.com:FlamboyantEngineer/
        shell: bash
        run: |
          if [ -d node_modules ]; then npm install --no-audit --no-fund; else npm ci; fi
      # A kept tree may only cost time, never change what is measured: the lock is unchanged and the
      # tree is exactly what it describes.
      - name: The installed tree is the lock's
        shell: bash
        run: git diff --exit-code package-lock.json && npm ls --all > /dev/null
      - run: npx vitest run src/layout-engine/font-files/measurer.test.ts

  check:
    # The status the dev branch rules require: it passes only when the gates and every browser test
    # job passed, so a failed, cancelled or skipped job fails it. The font-file job may be skipped, when
    # the change does not reach the font-file widths, but not fail.
    if: ${{ !cancelled() }}
    needs: [gates, labs, font-file-changes, font-files]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gates and browser tests passed
        env:
          RESULTS: ${{ needs.gates.result }} ${{ needs.labs.result }} ${{ needs.font-file-changes.result }}
          FONT_FILES: ${{ needs.font-files.result }}
          CHANGED: ${{ needs.font-file-changes.outputs.changed }}
        run: |
          for result in $RESULTS; do test "$result" = success || exit 1; done
          test "$FONT_FILES" = success || { test "$FONT_FILES" = skipped && test "$CHANGED" = false; }
