name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reuse:
    # On a push to dev or main: whether the pushed tree is exactly that of a merged pull request head
    # whose `check` passed. A pull request may only merge when it is up to date with dev, so its last
    # run tested this very tree; the push then runs no test again and only keeps the caches warm.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha)
          for head in $(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[] | select(.merged_at) | .head.sha'); do
            test "$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha)" = "$tree" || continue
            conclusion=$(gh api "repos/$REPO/commits/$head/check-runs?check_name=check&filter=latest" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")][0].conclusion')
            if [ "$conclusion" = success ]; then
              echo "Tree $tree passed check at $head, the head of its pull request."
              echo passed=true >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No merged pull request head with this tree passed check: everything runs."
          echo passed=false >> "$GITHUB_OUTPUT"

  caches:
    # When the tests are reused, the caches pull requests restore from dev are still kept current.
    needs: reuse
    if: needs.reuse.outputs.passed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
        with:
          read-token: ${{ secrets.UI_COMPONENTS_READ_TOKEN }}
      - uses: ./.github/actions/browser

  gates:
    needs: reuse
    # A skipped `reuse` (every pull request) does not hold this job back.
    if: ${{ !cancelled() && needs.reuse.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
        with:
          read-token: ${{ secrets.UI_COMPONENTS_READ_TOKEN }}
      # scripts/check.mjs is the one list of gates, shared with `npm run check` locally. The browser
      # tests run in the labs jobs beside it, and the packed-consumer check in a job of its own.
      - name: Checks
        run: npm run check -- --skip test:labs --skip check:consumer --skip test:guard-budgets

  consumer:
    # The packed-consumer check: mostly installs, so it runs beside the gates rather than after them.
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
        with:
          read-token: ${{ secrets.UI_COMPONENTS_READ_TOKEN }}
      - run: npm run build
      # It installs the pinned repositories again, with the read token.
      - name: Packed consumer with the tested set
        env:
          GIT_CONFIG_COUNT: 3
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/FlamboyantEngineer/
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_1: ssh://git@github.com/FlamboyantEngineer/
          GIT_CONFIG_KEY_2: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_2: git@github.com:FlamboyantEngineer/
        run: npm run check:consumer

  labs:
    # The browser tests of `npm run test:labs`, split across runners: the Chromium lab tests in
    # shards, and the timing tests in a job of their own, so no other test shares their machine.
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lab tests, the one-result invariant's page checks at ratio 1 and the invariant at the
          # display scaling ratios 150, 175 and 300 percent, dealt into four shards by their recorded
          # seconds (scripts/lab-shards.mjs, DOCE-LABS-10.1), so the shards end at about the same time.
          - name: chromium 1 of 4
            shard: 1
            args: --project=chromium --project=chromium-invariant --project=chromium-dpr-1.5 --project=chromium-dpr-1.75 --project=chromium-dpr-3
          - name: chromium 2 of 4
            shard: 2
            args: --project=chromium --project=chromium-invariant --project=chromium-dpr-1.5 --project=chromium-dpr-1.75 --project=chromium-dpr-3
          - name: chromium 3 of 4
            shard: 3
            args: --project=chromium --project=chromium-invariant --project=chromium-dpr-1.5 --project=chromium-dpr-1.75 --project=chromium-dpr-3
          - name: chromium 4 of 4
            shard: 4
            args: --project=chromium --project=chromium-invariant --project=chromium-dpr-1.5 --project=chromium-dpr-1.75 --project=chromium-dpr-3
          # The Pretext closeness tests and the one-result invariant at real device pixel ratios, but
          # for the pages painted into canvases (DOCE-EDITOR-1.9, DOCE-LABS-8.9), which the
          # performance job runs after its timing tests.
          - name: device pixel ratios
            # Quoted: the arguments are written into the step's script, where a bare `|` is a pipe.
            args: "--project=chromium-dpr-1.25 --project=chromium-dpr-2 --grep-invert='DOCE-EDITOR-1.9|DOCE-LABS-8.9'"
          # Without their dependency on the lab tests, which the shards run; the heaviest timing test
          # still runs alone before the others.
          - name: performance
            args: --project=review-scale --no-deps
            then: --project=performance --no-deps
            after: --project=chromium-dpr-1.25 --project=chromium-dpr-2 --grep=DOCE-EDITOR-1.9|DOCE-LABS-8.9
    name: labs (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
        with:
          read-token: ${{ secrets.UI_COMPONENTS_READ_TOKEN }}
      # The browser tests need Playwright's own Chromium, which the runner image does not carry.
      - uses: ./.github/actions/browser
      - run: npm run build:labs
      - name: This shard's tests
        if: matrix.shard
        run: node scripts/lab-shards.mjs plan --shards 4 --shard ${{ matrix.shard }} --out "$RUNNER_TEMP/tests.txt" -- ${{ matrix.args }}
      # Guard timing shares only the dedicated performance runner, sequentially with browser budgets.
      - name: Guard functional cases and budgets
        if: matrix.name == 'performance'
        run: npm run test:guard-budgets
      - name: Lab browser tests (${{ matrix.name }})
        run: |
          npx playwright test ${{ matrix.args }} ${{ matrix.shard && '--test-list "$RUNNER_TEMP/tests.txt"' || '' }}
          if [ -n "$THEN" ]; then npx playwright test $THEN; fi
          if [ -n "$AFTER" ]; then npx playwright test $AFTER; fi
        env:
          THEN: ${{ matrix.then }}
          AFTER: ${{ matrix.after }}

  font-file-changes:
    # Whether the change reaches the font-file widths: the measurer and the layout engine, its test
    # helpers and fonts, the dependencies (the Pretext fork pin, HarfBuzz, the font packages) or this
    # workflow. A push to dev or main always counts.
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo changed=true >> "$GITHUB_OUTPUT"; exit 0; fi
          paths='^(src/layout-engine/|test/font-files-|test/fixtures/fonts/|package\.json$|package-lock\.json$|vitest\.config\.ts$|\.github/workflows/ci\.yml$)'
          if git diff --name-only "$BASE" HEAD | grep -Eq "$paths"; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo changed=false >> "$GITHUB_OUTPUT"
          fi

  font-files:
    # The font-file widths and line breaks in Node on Windows (DOCE-PAGINATION-12.1), the fingerprints
    # the Linux jobs pin, with no browser: the same files shall give the same result on every system.
    # macOS runs them weekly in the other-systems workflow, as its runners can be too scarce to hold a
    # pull request on.
    needs: font-file-changes
    # A skipped `reuse` above does not skip this job.
    if: ${{ !cancelled() && needs.font-file-changes.outputs.changed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    name: font files (${{ matrix.os }})
    steps:
      # The fonts and fixtures are read as bytes: no line ending conversion on Windows.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # A cold `npm ci` takes about 16 minutes on Windows (the git dependencies are prepared there), so
      # the installed tree is kept per system and lock file. An older tree is brought up to the lock
      # with `npm install`, and only a miss installs from nothing.
      - id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: font-files-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', '.nvmrc') }}
          restore-keys: font-files-modules-${{ runner.os }}-
      # The base component library is a private git dependency, read with the token as in the gates job.
      - name: Install, reading the base component library with the read token
        if: steps.modules.outputs.cache-hit != 'true'
        env:
          GIT_CONFIG_COUNT: 3
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/FlamboyantEngineer/
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_1: ssh://git@github.com/FlamboyantEngineer/
          GIT_CONFIG_KEY_2: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_2: git@github.com:FlamboyantEngineer/
        shell: bash
        run: |
          if [ -d node_modules ]; then npm install --no-audit --no-fund; else npm ci; fi
      # A kept tree may only cost time, never change what is measured: the lock is unchanged and the
      # tree is exactly what it describes.
      - name: The installed tree is the lock's
        shell: bash
        run: git diff --exit-code package-lock.json && npm ls --all > /dev/null
      - run: npx vitest run src/layout-engine/font-files/measurer.test.ts

  check:
    # The status the dev branch rules require: it passes only when the gates, the packed consumer and
    # every browser test job passed, so a failed, cancelled or skipped job fails it. The font-file job
    # may be skipped, when the change does not reach the font-file widths, but not fail. On a push whose
    # tree already passed in its pull request, nothing ran again.
    if: ${{ !cancelled() }}
    needs: [reuse, gates, consumer, labs, font-file-changes, font-files]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gates and browser tests passed
        env:
          REUSED: ${{ needs.reuse.outputs.passed }}
          RESULTS: ${{ needs.gates.result }} ${{ needs.consumer.result }} ${{ needs.labs.result }} ${{ needs.font-file-changes.result }}
          FONT_FILES: ${{ needs.font-files.result }}
          CHANGED: ${{ needs.font-file-changes.outputs.changed }}
        run: |
          if [ "$REUSED" = true ]; then echo "This tree passed check in its pull request."; exit 0; fi
          for result in $RESULTS; do test "$result" = success || exit 1; done
          test "$FONT_FILES" = success || { test "$FONT_FILES" = skipped && test "$CHANGED" = false; }
