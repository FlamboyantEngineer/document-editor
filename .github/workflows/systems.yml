name: Other systems

# Once a week, on macOS and Windows: the font-file widths and line breaks and the MathJax equation
# layouts in Node (DOCE-PAGINATION-12.1, DOCE-PAGINATION-12.12), which pull requests check on Linux and
# Windows only, and the font-file widths, equation layouts and pinned layout fingerprints in Chromium
# (DOCE-LABS-7.1, DOCE-LABS-7.5, DOCE-LABS-8.8), which pull requests check on Linux only.
# It runs on a schedule or by hand, never on pull requests, and is not part of `check`: a failure
# opens one issue, or comments on it while it is open, and blocks nothing.

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: systems-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    name: browser (${{ matrix.os }})
    steps:
      # The fonts and fixtures are read as bytes: no line ending conversion on Windows.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The base component library is a private git dependency, read with the token as in CI.
      - name: Install, reading the base component library with the read token
        env:
          GIT_CONFIG_COUNT: 3
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/FlamboyantEngineer/
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_1: ssh://git@github.com/FlamboyantEngineer/
          GIT_CONFIG_KEY_2: url.https://x-access-token:${{ secrets.UI_COMPONENTS_READ_TOKEN }}@github.com/FlamboyantEngineer/.insteadOf
          GIT_CONFIG_VALUE_2: git@github.com:FlamboyantEngineer/
        run: npm ci
      - name: Font-file widths and line breaks in Node
        run: npx vitest run src/layout-engine/font-files/measurer.test.ts src/layout-engine/math/mathjax-layouter.test.ts
      - run: npx playwright install chromium
      - run: npm run build:labs
      - name: Font-file widths and pinned fingerprints
        run: >-
          npx playwright test e2e/font-widths.spec.ts e2e/layout-invariant.spec.ts
          --project=chromium --project=chromium-dpr-1.25 --project=chromium-dpr-2 --no-deps
          --grep "DOCE-LABS-7.1|DOCE-LABS-7.5|DOCE-LABS-8.8"

  report:
    # One open issue holds the failures: a new one is opened only when none is open.
    needs: browser
    if: ${{ always() && needs.browser.result != 'success' && needs.browser.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Font-file widths or pinned fingerprints differ on macOS or Windows
        run: |
          body="The weekly run on other systems failed: $RUN (DOCE-LABS-7.1, DOCE-LABS-7.5, DOCE-LABS-8.8)."
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
