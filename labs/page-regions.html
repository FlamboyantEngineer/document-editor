<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="Page headers and footers from a template, with live page numbers and document name."
    />
    <title>Page headers and footers · Labs</title>
    <link rel="stylesheet" href="reference/document.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #eef0f3;
        color: #1d2129;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      fieldset {
        display: flex;
        gap: 16px;
        margin: 0 0 16px;
        border: 0;
        padding: 0;
      }
    </style>
    <script type="module" src="build/page-regions.js"></script>
  </head>
  <body>
    <main id="lab-root">
      <h1>Page headers and footers</h1>
      <p>
        The template puts a header and a footer on every page. The footer numbers the pages and the
        header shows the document's name, both kept live. A taller header leaves less room for
        content, and the pages are laid out again.
      </p>
      <fieldset>
        <legend>Regions</legend>
        <label
          >Document name <input type="text" name="document-name" value="Interface requirements"
        /></label>
        <label><input type="checkbox" name="tall-header" /> Two-line header</label>
      </fieldset>
      <div class="de-document-editor__measure" aria-hidden="true"></div>
      <div class="lab-pages de-document-editor"></div>
    </main>
  </body>
</html>
