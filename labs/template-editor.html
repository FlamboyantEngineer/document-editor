      name="viewport"

    />
    <link rel="icon" href="data:," />

    <script type="module" src="build/chrome.js"></script>
    <script type="module" src="build/template-editor.js"></script>

    <main id="lab-root" class="lab-fill">
      <h1>Template editor</h1>

        The template inherits from the base template; its fields show the inherited values until it
        sets its own. Change a setting and the document beside it follows.
      </p>
      <div id="lab-editor" class="lab-editor"></div>
    </main>
  </body>
