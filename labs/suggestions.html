<!doctype html>
<html lang="en" data-reference-document>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      html[data-lab-stylesheet-state='loading'] :is(#lab-root, #lab-index) {
        visibility: hidden;
      }
    </style>
    <script src="build/boot.js"></script>
    <meta
      name="description"
      content="Suggestions: changes kept as suggested insertions and deletions, attributed, then accepted or rejected."
    />
    <title>Suggestions · Labs</title>
    <script type="module" src="build/chrome.js"></script>
    <script type="module" src="build/suggestions.js"></script>
  </head>
  <body>
    <header id="lab-chrome"></header>
    <main id="lab-root">
      <h1>Suggestions</h1>
      <p>
        While suggesting, what you type is kept as a suggested insertion and what you delete stays
        in place, struck, both attributed to the writer you pick. Press Enter inside a paragraph and
        its two halves are suggested in its place. Accept or reject each suggestion from the list.
      </p>
      <div id="lab-editor"></div>
    </main>
  </body>
