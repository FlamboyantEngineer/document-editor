    <script type="module" src="build/chrome.js"></script>

    <header id="lab-chrome"></header>
    <main id="lab-root">
      <h1>Comments</h1>
      <p>
        Open threads and suggestions sit in the margin, level with their text. Select text and press
        Comment to start a thread; reply, resolve, or delete your own thread from its card. A
        suggestion's card accepts or rejects it, and its discussion becomes a thread of its own.
      </p>
      <div id="lab-editor"></div>
    </main>
