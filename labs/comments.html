<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />

      name="description"
      content="Comments: threads on the document's text and on its suggestions, in a margin beside the pages."
    />
    <title>Comments · Labs</title>
    <link rel="stylesheet" href="build/ui-components.css" />
    <link rel="stylesheet" href="reference/document.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #eef0f3;
        color: #1d2129;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      fieldset {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;

        margin: 0 0 16px;

        padding: 0;

  <body>
    <main id="lab-root">
      <h1>Comments</h1>
      <p>
        Open threads and suggestions sit in the margin, level with their text. Select text and press
        Comment to start a thread; reply, resolve, or delete your own thread from its card. A
        suggestion's card accepts or rejects it, and its discussion becomes a thread of its own.
      </p>
      <div id="lab-editor"></div>
    </main>
