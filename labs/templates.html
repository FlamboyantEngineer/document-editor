<!doctype html>
<html lang="en" data-reference-document>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      html[data-lab-stylesheet-state='loading'] :is(#lab-root, #lab-index) {
        visibility: hidden;
      }
    </style>
    <script src="build/boot.js"></script>
    <meta
      name="description"
      content="A document styled and paged by a template, which a reader can switch."
    />
    <title>Templates · Labs</title>
    <script type="module" src="build/chrome.js"></script>
    <script type="module" src="build/templates.js"></script>
  </head>
  <body>
    <header id="lab-chrome"></header>
    <main id="lab-root">
      <h1>Templates</h1>
      <p>
        The template sets the page size and margins, the fonts, the colors and the heading and list
        numbering. Choose another and the document is laid out again on its pages.
      </p>
      <fieldset>
        <legend>Template</legend>
        <label><input type="radio" name="template" value="base" checked /> Base (A4)</label>
        <label
          ><input type="radio" name="template" value="compact" /> Compact (US Letter,
          landscape)</label
        >
      </fieldset>
      <div class="de-document-editor__measure" aria-hidden="true" inert></div>
      <div class="lab-pages de-document-editor"></div>
    </main>
  </body>
</html>
