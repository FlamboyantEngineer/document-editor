<!doctype html>
<html lang="en" data-reference-document>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      html[data-lab-stylesheet-state='loading'] :is(#lab-root, #lab-index) {
        visibility: hidden;
      }
    </style>
    <script src="build/boot.js"></script>
    <meta
      name="description"
      content="A document laid out on fixed-height pages with footnotes, which follow its edits and the page width."
    />
    <title>Pagination · Labs</title>
    <style>
      body {
        font:
          16px/1.5 Georgia,
          serif;
      }
      :root {
        --lab-width: 480px;
      }
      .lab-measure {
        position: absolute;
        left: -10000px;
        top: 0;
        width: var(--lab-width);
      }
      /*
       * The pages draw the content in the reference stylesheet from the template the engine lays
       * them out in; only the page box is the lab's: its content the lab's width and 360 pixels
       * tall, the template's side margins leaving that width.
       */
      .lab-pages.de-document-editor .pm-section {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
      }
      .lab-pages.de-document-editor .pm-page {
        box-sizing: content-box;
        width: var(--lab-width);
        height: 360px;
        padding: 32px;
      }
    </style>
    <script type="module" src="build/chrome.js"></script>
    <script type="module" src="build/pagination.js"></script>
  </head>
  <body>
    <header id="lab-chrome"></header>
    <main id="lab-root">
      <h1>Pagination</h1>
      <p>
        The document is measured in a hidden view and laid out on pages 360 pixels tall, each
        leaving room for its footnotes. Type in it, or change the page width: the pages follow, and
        the caret stays where it was.
      </p>
      <button type="button" class="lab-narrow" aria-pressed="false">Narrow pages</button>
      <div class="lab-measure" aria-hidden="true"></div>
      <div class="lab-pages de-document-editor"></div>
    </main>
  </body>
</html>
